<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>NEBULA</title>
    <!-- Gerado por scripts/gen-public.mjs a partir de site.config.json. Não editar à mão. -->
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?/' +
        l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
