name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Para republicar sem haver nada de novo no código. Serve para quando muda um
  # secret: o build lê-os no momento em que corre, e sem isto era preciso
  # inventar um commit para pôr um secret novo em vigor.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # A base de dados e as Edge Functions, antes do site
  # ───────────────────────────────────────────────────────────────────────────
  #
  # Estavam as duas por correr à mão, e à mão é onde isto se desencontra: um
  # commit que acrescenta uma tabela e uma página que a usa publica-se em
  # segundos, a tabela fica para depois, e quem descobre é quem abrir o painel.
  # Aqui vão juntos ou não vão.
  #
  # O `deploy` do site espera por este trabalho de propósito. É o contrário da
  # regra do resto do ficheiro, onde falhar um passo publica-se à mesma: uma
  # pré-renderização falhada dá um site com metadados piores, enquanto um
  # esquema por aplicar dá um painel a escrever para tabelas que não existem.
  # O segundo é pior do que não publicar.
  base-de-dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # O ref do projecto sai do endereço do Supabase, que já é secret. Um
      # secret a menos para manter, e um a menos para pôr errado.
      - name: Ler o projecto
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          REF="$(printf '%s' "$URL" | sed -n 's#^https\?://\([a-z0-9-]*\)\.supabase\.co/*$#\1#p')"
          if [ -z "$REF" ]; then
            echo "::error::Não consegui ler o ref do projecto a partir de VITE_SUPABASE_URL."
            exit 1
          fi
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"
          echo "Projecto: $REF"

      # ── O esquema ───────────────────────────────────────────────────────────
      #
      # O supabase/schema.sql inteiro, de cada vez. É escrito para isso: tudo
      # `if not exists`, `create or replace` e `drop policy if exists`, e não há
      # um `drop table`, um `delete` nem um `truncate` no ficheiro todo.
      # Verificado a aplicá-lo três vezes seguidas a uma base de dados com
      # fotografias, eventos e contadores lá dentro, e a contar as linhas antes
      # e depois: nada mudou.
      #
      # `ON_ERROR_STOP=1` e uma transação só: ou entra tudo, ou não entra nada e
      # a base de dados fica exactamente como estava.
      - name: Aplicar o esquema
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL por definir: o esquema não foi aplicado. Settings → Secrets and variables → Actions, e o valor é a connection string do 'Session pooler' do Supabase (Project Settings → Database)."
            exit 0
          fi

          # Espaços à volta são o erro mais comum a colar uma connection string,
          # e já custou uma publicação inteira deste site uma vez, com o
          # endereço do Worker. Limpam-se e segue.
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '[:space:]')"
          case "$DB_URL" in
            postgres://*|postgresql://*) : ;;
            *) echo "::error::SUPABASE_DB_URL não parece uma connection string; deve começar por postgresql://"; exit 1 ;;
          esac
          # O pooler de transações (6543) não serve para isto: não guarda estado
          # entre comandos, e um ficheiro de esquema numa transação só morre lá
          # com um erro que não diz o que se passa. O de sessões é o 5432.
          case "$DB_URL" in
            *:6543/*) echo "::error::SUPABASE_DB_URL aponta para o pooler de transações (porta 6543). Para aplicar o esquema é preciso o 'Session pooler', na porta 5432."; exit 1 ;;
          esac

          # A imagem do runner costuma trazer o psql. Quando não trouxer, não é
          # razão para não publicar nada.
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client

          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/schema.sql
          echo "Esquema aplicado."

      # ── As Edge Functions ───────────────────────────────────────────────────
      #
      # A lista sai dos próprios ficheiros: cada função traz no cabeçalho a
      # linha `// Deploy: supabase functions deploy <nome> [--no-verify-jwt]`, e
      # é essa que se corre. Escrever a lista aqui era ter dois sítios a dizer a
      # mesma coisa, e o segundo a ficar para trás na primeira função nova —
      # que é precisamente o que acabou de acontecer com a print-gallery.
      #
      # Uma pasta sem essa linha faz falhar o trabalho em vez de ser saltada em
      # silêncio: uma função que não se publica não dá erro nenhum até alguém a
      # chamar, e aí dá-o à frente de um convidado.
      - name: Publicar as Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN por definir: as Edge Functions não foram publicadas. Cria um em supabase.com/dashboard/account/tokens."
            exit 0
          fi
          falhou=0
          for dir in supabase/functions/*/; do
            nome="$(basename "$dir")"
            case "$nome" in _*) continue ;; esac
            linha="$(grep -m1 -o "functions deploy $nome[^\"]*" "$dir/index.ts" || true)"
            if [ -z "$linha" ]; then
              echo "::error::supabase/functions/$nome não diz como se publica. Falta a linha '// Deploy: supabase functions deploy $nome ...' no cabeçalho."
              falhou=1
              continue
            fi
            # Só a flag é lida da linha; o nome vem da pasta, para um copiar-colar
            # no cabeçalho não publicar uma função por cima de outra.
            flag=""
            case "$linha" in *--no-verify-jwt*) flag="--no-verify-jwt" ;; esac
            echo "→ $nome $flag"
            npx --yes supabase@latest functions deploy "$nome" \
              --project-ref "$PROJECT_REF" $flag || falhou=1
          done
          [ "$falhou" -eq 0 ] || { echo "::error::Houve funções por publicar."; exit 1; }
          echo "Edge Functions publicadas."

  deploy:
    needs: base-de-dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Necessário para a pré-renderização: as páginas públicas são capturadas
      # num browser verdadeiro depois do build (ver scripts/prerender.mjs).
      - run: npx playwright install --with-deps chromium

      # As chaves do Supabase entram no build, e sem elas o site publicado sobe
      # sem forma de falar com a base de dados: o painel não abre e as galerias
      # de cliente não carregam. Falhar aqui, com o motivo escrito, é melhor do
      # que publicar isso e deixar alguém descobri-lo pelo link que já entregou.
      - name: Confirmar que os secrets existem
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          R2: ${{ secrets.VITE_R2_PUBLIC_URL }}
          FORM: ${{ secrets.VITE_CONTACT_ENDPOINT }}
          ZIP: ${{ secrets.VITE_ZIP_WORKER_URL }}
        run: |
          falta=""
          [ -z "$URL" ] && falta="$falta VITE_SUPABASE_URL"
          [ -z "$ANON" ] && falta="$falta VITE_SUPABASE_ANON_KEY"
          if [ -n "$falta" ]; then
            echo "::error::Faltam secrets:$falta — Settings → Secrets and variables → Actions"
            exit 1
          fi
          case "$URL" in
            */rest/v1|*/auth/v1|*/) echo "::error::VITE_SUPABASE_URL tem caminho a mais; deve ser só https://<ref>.supabase.co"; exit 1 ;;
          esac
          # O R2 público só serve fotografias carregadas pelo painel. O site
          # marketing usa as imagens do repositório, por isso isto avisa e segue.
          [ -z "$R2" ] && echo "::warning::VITE_R2_PUBLIC_URL vazio: fotografias carregadas pelo painel não aparecem."
          # O Worker do ZIP: sem ele o módulo dos casamentos funciona todo, só
          # falta o botão de descarregar tudo. Avisa e segue.
          #
          # Espaços à volta são o erro mais comum a colar um endereço, e um
          # endereço não pode ter espaços nenhuns: limpam-se e segue. Já
          # aconteceu uma vez este passo travar a publicação do site inteiro
          # por causa de um espaço à frente do https, o que é uma maneira cara
          # de corrigir uma coisa barata.
          ZIP_LIMPO="$(printf '%s' "$ZIP" | tr -d '[:space:]')"
          if [ -z "$ZIP_LIMPO" ]; then
            echo "::warning::VITE_ZIP_WORKER_URL vazio: o painel fica sem o botão de descarregar o casamento."
          else
            [ "$ZIP_LIMPO" != "$ZIP" ] && echo "::warning::VITE_ZIP_WORKER_URL tinha espaços à volta; foram retirados para este build. Vale a pena corrigir o secret."
            case "$ZIP_LIMPO" in
              https://*) echo "VITE_ZIP_WORKER_URL presente." ;;
              # Aqui sim é erro: um endereço que não é um endereço não melhora
              # com boa vontade, e publicar com ele dava um botão que falhava.
              *) echo "::error::VITE_ZIP_WORKER_URL não começa por https:// — o valor deve ser o endereço que o 'npx wrangler deploy' imprimiu."; exit 1 ;;
            esac
            case "$ZIP_LIMPO" in
              */) ZIP_LIMPO="${ZIP_LIMPO%/}"; echo "::warning::VITE_ZIP_WORKER_URL acabava em barra; foi retirada." ;;
            esac
          fi
          # Passa ao build já limpo (ver o passo do vite build, que o lê daqui).
          echo "VITE_ZIP_WORKER_URL=$ZIP_LIMPO" >> "$GITHUB_ENV"
          # O do formulário não é obrigatório — sem ele o site abre o programa
          # de email do visitante, que funciona. Mas é indistinguível de "está
          # configurado e falhou", por isso fica dito qual dos dois é.
          if [ -z "$FORM" ]; then
            echo "::warning::VITE_CONTACT_ENDPOINT vazio: o formulário abre o programa de email em vez de enviar."
          else
            echo "VITE_CONTACT_ENDPOINT presente (${#FORM} caracteres)."
            # O painel do Formspree vive em /forms/<id> e o endereço de envio é
            # /f/<id>. Quem copia da barra do browser apanha o primeiro, e o
            # site fica a enviar para uma página em vez de para o serviço.
            case "$FORM" in
              *formspree.io/forms/*)
                echo "::error::VITE_CONTACT_ENDPOINT aponta para a página do painel (/forms/). O endereço de envio é https://formspree.io/f/<id>."
                exit 1 ;;
              *formspree.io/f/*) echo "Formato do endereço do Formspree: correcto." ;;
              https://*) echo "Endereço de formulário não-Formspree; formato não verificado." ;;
              *) echo "::error::VITE_CONTACT_ENDPOINT não começa por https://"; exit 1 ;;
            esac
            case "$FORM" in
              */) echo "::warning::VITE_CONTACT_ENDPOINT acaba em barra; o serviço pode recusar." ;;
            esac
          fi
          echo "Secrets presentes."

      # O build e a pré-renderização ficam em passos separados de propósito: se
      # a captura falhar, o site é publicado na mesma como aplicação de página
      # única, que é o que já era antes disto. Perder metadados nas partilhas é
      # mau; deixar de publicar é pior.
      - run: npx tsc -b && npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_R2_PUBLIC_URL: ${{ secrets.VITE_R2_PUBLIC_URL }}
          # Vazias enquanto não houver conta de estatísticas: sem SRC o site não
          # carrega script nenhum (ver src/lib/Analytics.tsx).
          VITE_ANALYTICS_SRC: ${{ secrets.VITE_ANALYTICS_SRC }}
          VITE_ANALYTICS_DOMAIN: ${{ secrets.VITE_ANALYTICS_DOMAIN }}
          VITE_ANALYTICS_ID: ${{ secrets.VITE_ANALYTICS_ID }}
          VITE_CONTACT_ENDPOINT: ${{ secrets.VITE_CONTACT_ENDPOINT }}
          # O VITE_ZIP_WORKER_URL não vem daqui: vem do passo de verificação, já
          # sem espaços à volta, através do GITHUB_ENV. Voltar a declará-lo
          # aqui sobrepunha-se à versão limpa e trazia o problema de volta.

      - run: npm run prerender || echo "::warning::Pré-renderização falhou; publica-se a versão SPA."

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
