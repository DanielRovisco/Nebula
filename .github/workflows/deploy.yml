name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Necessário para a pré-renderização: as páginas públicas são capturadas
      # num browser verdadeiro depois do build (ver scripts/prerender.mjs).
      - run: npx playwright install --with-deps chromium

      # As chaves do Supabase entram no build, e sem elas o site publicado sobe
      # sem forma de falar com a base de dados: o painel não abre e as galerias
      # de cliente não carregam. Falhar aqui, com o motivo escrito, é melhor do
      # que publicar isso e deixar alguém descobri-lo pelo link que já entregou.
      - name: Confirmar que os secrets existem
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          R2: ${{ secrets.VITE_R2_PUBLIC_URL }}
          FORM: ${{ secrets.VITE_CONTACT_ENDPOINT }}
        run: |
          falta=""
          [ -z "$URL" ] && falta="$falta VITE_SUPABASE_URL"
          [ -z "$ANON" ] && falta="$falta VITE_SUPABASE_ANON_KEY"
          if [ -n "$falta" ]; then
            echo "::error::Faltam secrets:$falta — Settings → Secrets and variables → Actions"
            exit 1
          fi
          case "$URL" in
            */rest/v1|*/auth/v1|*/) echo "::error::VITE_SUPABASE_URL tem caminho a mais; deve ser só https://<ref>.supabase.co"; exit 1 ;;
          esac
          # O R2 público só serve fotografias carregadas pelo painel. O site
          # marketing usa as imagens do repositório, por isso isto avisa e segue.
          [ -z "$R2" ] && echo "::warning::VITE_R2_PUBLIC_URL vazio: fotografias carregadas pelo painel não aparecem."
          # O do formulário não é obrigatório — sem ele o site abre o programa
          # de email do visitante, que funciona. Mas é indistinguível de "está
          # configurado e falhou", por isso fica dito qual dos dois é.
          if [ -z "$FORM" ]; then
            echo "::warning::VITE_CONTACT_ENDPOINT vazio: o formulário abre o programa de email em vez de enviar."
          else
            echo "VITE_CONTACT_ENDPOINT presente (${#FORM} caracteres)."
            # O painel do Formspree vive em /forms/<id> e o endereço de envio é
            # /f/<id>. Quem copia da barra do browser apanha o primeiro, e o
            # site fica a enviar para uma página em vez de para o serviço.
            case "$FORM" in
              *formspree.io/forms/*)
                echo "::error::VITE_CONTACT_ENDPOINT aponta para a página do painel (/forms/). O endereço de envio é https://formspree.io/f/<id>."
                exit 1 ;;
              *formspree.io/f/*) echo "Formato do endereço do Formspree: correcto." ;;
              https://*) echo "Endereço de formulário não-Formspree; formato não verificado." ;;
              *) echo "::error::VITE_CONTACT_ENDPOINT não começa por https://"; exit 1 ;;
            esac
            case "$FORM" in
              */) echo "::warning::VITE_CONTACT_ENDPOINT acaba em barra; o serviço pode recusar." ;;
            esac
          fi
          echo "Secrets presentes."

      # O build e a pré-renderização ficam em passos separados de propósito: se
      # a captura falhar, o site é publicado na mesma como aplicação de página
      # única, que é o que já era antes disto. Perder metadados nas partilhas é
      # mau; deixar de publicar é pior.
      - run: npx tsc -b && npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_R2_PUBLIC_URL: ${{ secrets.VITE_R2_PUBLIC_URL }}
          # Vazias enquanto não houver conta de estatísticas: sem SRC o site não
          # carrega script nenhum (ver src/lib/Analytics.tsx).
          VITE_ANALYTICS_SRC: ${{ secrets.VITE_ANALYTICS_SRC }}
          VITE_ANALYTICS_DOMAIN: ${{ secrets.VITE_ANALYTICS_DOMAIN }}
          VITE_ANALYTICS_ID: ${{ secrets.VITE_ANALYTICS_ID }}
          VITE_CONTACT_ENDPOINT: ${{ secrets.VITE_CONTACT_ENDPOINT }}

      - run: npm run prerender || echo "::warning::Pré-renderização falhou; publica-se a versão SPA."

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
