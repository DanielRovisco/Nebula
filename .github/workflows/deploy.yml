name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ⚠️ TEMPORÁRIO — galerias em modo de demonstração no site publicado.
      #
      # Serve para explorar o painel e a galeria do cliente sem login e sem
      # Supabase. Os dados são falsos e vivem no browser de quem visita: não há
      # fotografias de clientes envolvidas, e por isso não há nada exposto.
      #
      # ANTES DE LIGAR O SUPABASE A SÉRIO: apagar este bloco e voltar a
      # `npm run build`, senão o site publicado continua a servir galerias de
      # brincar em vez das verdadeiras.
      - run: npm run build:demo

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
