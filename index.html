<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Pinta a barra do browser em Android e a barra de estado no iOS. -->
    <meta name="theme-color" content="#191919" />
    <meta name="apple-mobile-web-app-title" content="NEBULA" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="NEBULA — Fotógrafo e videógrafo para casamentos, maternidade e eventos em Lisboa e Portalegre. Fotografia editorial e vídeo cinematográfico 4K. Narrativa visual com rigor e autenticidade." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEBULA" />
    <meta property="og:title" content="NEBULA — Fotografia & Vídeo Cinematográfico em Lisboa" />
    <meta property="og:description" content="Fotografia editorial e vídeo cinematográfico para casamentos, maternidade e eventos. Lisboa & Portalegre. Narrativa, não apenas registo." />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="1920" />
    <meta property="og:locale" content="pt_PT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEBULA — Fotografia & Vídeo Cinematográfico" />
    <meta name="twitter:description" content="Fotografia editorial e vídeo 4K para casamentos, maternidade e eventos. Lisboa & Portalegre." />
    <title>NEBULA — Fotografia & Vídeo Cinematográfico em Lisboa</title>

    <!--
      O hero é o elemento de LCP e é renderizado pelo React, logo o preload
      scanner do browser não o descobre no HTML. Este preload arranca o
      download em paralelo com o bundle em vez de depois dele.
    -->
    <!--
      O preload tem de anunciar o mesmo formato que o <picture> vai escolher,
      senão o browser descarrega duas vezes: uma para o preload e outra para a
      imagem que acaba por usar. Daí o AVIF aqui e o `type` a dizê-lo — quem não
      o souber ler ignora este preload e segue pelo caminho normal.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/brand/portfolio/hero-beach-dress-1440.avif"
      imagesrcset="/brand/portfolio/hero-beach-dress-480.avif 480w, /brand/portfolio/hero-beach-dress-960.avif 960w, /brand/portfolio/hero-beach-dress-1440.avif 1440w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
